<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MaloneX Pairing</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --border: #262b36;
      --text: #e8eaf0;
      --muted: #8b92a3;
      --accent: #4f7cff;
      --ok: #2fa96e;
      --warn: #d08b2c;
      --bad: #cf5c5c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: clamp(16px, 4vw, 40px); }
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 24px; }
    h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 0; letter-spacing: 0.04em; }
    .sub { color: var(--muted); font-size: 0.9rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    input[type="text"] {
      flex: 1 1 220px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 1rem;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button.danger { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
    button:disabled { opacity: 0.5; cursor: default; }
    .pill {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.78rem;
      border: 1px solid var(--border);
      color: var(--muted);
      text-transform: capitalize;
    }
    .pill.connected { color: var(--ok); border-color: var(--ok); }
    .pill.pairing, .pill.reconnecting { color: var(--warn); border-color: var(--warn); }
    .pill.logged_out, .pill.disconnected, .pill.stopped { color: var(--bad); border-color: var(--bad); }
    .session { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
    .session .name { font-weight: 600; font-size: 1.02rem; }
    .session .meta { color: var(--muted); font-size: 0.85rem; }
    .qr { text-align: center; padding: 16px; }
    .qr img { max-width: 100%; height: auto; border-radius: 8px; background: #fff; padding: 8px; }
    .empty { color: var(--muted); text-align: center; padding: 12px 0; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 18px; display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>MaloneX</h1>
      <span class="sub">Session pairing and control</span>
    </header>

    <div class="card">
      <div class="row">
        <input id="newId" type="text" placeholder="New session id (letters, numbers, - and _)" maxlength="64">
        <button id="createBtn">Create and pair</button>
      </div>
      <p class="muted">A QR code appears once WhatsApp is ready. Scan it from WhatsApp, Linked devices.</p>
    </div>

    <div id="qrCard" class="card qr" style="display:none">
      <h2 style="margin-top:0">Scan to pair</h2>
      <img id="qrImg" alt="WhatsApp pairing QR code">
      <p class="muted" id="qrSession"></p>
    </div>

    <div class="card">
      <h2 style="margin-top:0; font-size:1.1rem">Sessions</h2>
      <div id="sessions" class="empty">Loading...</div>
    </div>
  </div>
  <div id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let qrTarget = null;

    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 2600);
    }

    async function api(path, opts) {
      const res = await fetch(path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function refresh() {
      try {
        const data = await api('/api/sessions');
        const box = $('sessions');
        if (!data.sessions.length) {
          box.className = 'empty';
          box.textContent = 'No sessions yet. Create one above.';
          return;
        }
        box.className = '';
        box.innerHTML = '';
        for (const s of data.sessions) {
          const card = document.createElement('div');
          card.className = 'session';
          card.style.margin = '10px 0';
          const info = document.createElement('div');
          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = s.id;
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = s.phone ? 'Linked: ' + s.phone.slice(0, 3) + '*******' + s.phone.slice(-1) : 'Not linked';
          info.append(name, meta);
          const pill = document.createElement('span');
          pill.className = 'pill ' + (s.status || 'stopped');
          pill.textContent = s.status || 'stopped';
          const actions = document.createElement('div');
          actions.style.display = 'flex';
          actions.style.gap = '6px';
          const qrBtn = button('QR', 'ghost', () => showQr(s.id));
          const startBtn = button('Start', 'ghost', () => act('/api/sessions/' + s.id + '/start'));
          const stopBtn = button('Stop', 'ghost', () => act('/api/sessions/' + s.id + '/stop'));
          const delBtn = button('Delete', 'danger', () => {
            if (!confirm('Delete session ' + s.id + '?')) return;
            act('/api/sessions/' + s.id, { method: 'DELETE' });
          });
          actions.append(qrBtn, startBtn, stopBtn, delBtn);
          card.append(info, pill, actions);
          box.append(card);
        }
      } catch (err) {
        $('sessions').textContent = 'Failed to load sessions: ' + err.message;
      }
    }

    function button(label, cls, onClick) {
      const b = document.createElement('button');
      b.textContent = label;
      b.className = cls;
      b.addEventListener('click', onClick);
      return b;
    }

    async function act(path, opts) {
      try {
        await api(path, opts);
        toast('Done');
        refresh();
      } catch (err) {
        toast(err.message);
      }
    }

    async function create() {
      const id = $('newId').value.trim();
      if (!/^[A-Za-z0-9_-]{1,64}$/.test(id)) {
        toast('Use letters, numbers, hyphen and underscore only.');
        return;
      }
      try {
        await api('/api/sessions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        $('newId').value = '';
        showQr(id);
        refresh();
      } catch (err) {
        toast(err.message);
      }
    }

    async function showQr(id) {
      qrTarget = id;
      $('qrCard').style.display = 'block';
      $('qrSession').textContent = 'Session: ' + id;
      await pollQr();
    }

    async function pollQr() {
      if (!qrTarget) return;
      try {
        const data = await api('/api/sessions/' + qrTarget + '/qr');
        if (data.qr) {
          $('qrImg').src = data.qr;
        } else if (data.status === 'connected') {
          $('qrImg').removeAttribute('src');
          $('qrSession').textContent = 'Session ' + qrTarget + ' is connected.';
          setTimeout(() => { $('qrCard').style.display = 'none'; qrTarget = null; }, 2500);
          refresh();
          return;
        } else {
          $('qrImg').removeAttribute('src');
          $('qrSession').textContent = 'Session ' + qrTarget + ' is ' + data.status + '. Waiting for a QR code...';
        }
      } catch (err) {
        $('qrSession').textContent = err.message;
      }
      setTimeout(pollQr, 1500);
    }

    $('createBtn').addEventListener('click', create);
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
