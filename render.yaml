services:
  - type: web
    name: malonex
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SESSION
        sync: false
      - key: OWNER_PHONE
        sync: false
      - key: ACCESS_KEY
        generateValue: true
      - key: PREFIX
        value: "."
      - key: MODE
        value: private
      - key: PAIRING_SITE_URL
        value: https://brian.pairsite.space
      - key: TRUST_PROXY
        value: "true"
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: malonex-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
